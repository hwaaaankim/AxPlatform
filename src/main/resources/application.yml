# AxPlatform 0.5.0 공통 설정
# 실행 위치는 pom.xml이 있는 프로젝트 루트입니다.
# DB 접속값·키·비밀번호는 ./config/application-private.yml에서 필수로 읽습니다.
# 기본 프로파일: dev / 서버 프로파일: test
# 기본 회원 용량 1GiB, 활동 로그 180일, 파일 로그 30일·총 1GiB.
spring:
  profiles:
    default: dev
  application:
    name: AxPlatform
  config:
    import: 'file:./config/application-private.yml'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never
  thymeleaf:
    cache: false
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-binding-errors: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  forward-headers-strategy: none
  port: 8080
logging:
  file:
    name: '${ax.storage.root}/logs/application.log'
  logback:
    rollingpolicy:
      max-history: 30
      max-file-size: 20MB
      total-size-cap: 1GB
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
ax:
  storage:
    legacy-root: ./data/private
    default-quota-bytes: 1073741824
  operations:
    activity-retention-days: 180
  integrations:
    openai:
      enabled: true
      model: gpt-6-astra
      reasoning-effort: high
      max-output-tokens: 16000
      request-timeout-seconds: 120
      max-tool-rounds: 6
      max-assets: 3
      max-daily-runs: 30
      max-concurrent-runs: 2
      worker-threads: 2
      job-timeout-seconds: 300
    google-login:
      enabled: false
    kakao-login:
      enabled: false
    naver-login:
      enabled: false
    smtp:
      enabled: false
      port: 587
      auth: true
      starttls: true
      starttls-required: true
      ssl: false
    cafe24:
      enabled: false
    solapi:
      enabled: false
    toss:
      enabled: false
    document-editor:
      enabled: false
    hwp:
      enabled: false
  display-name: AxPlatform
  auth:
    registration-enabled: false
    terms-version: 2026-10-09-DRAFT
    privacy-version: 2026-10-09-DRAFT
