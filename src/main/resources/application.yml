spring:
  profiles:
    default: dev
  application:
    name: AxPlatform
  config:
    # Deliberately required: absent private config must not connect to an unintended DB.
    import: 'file:./config/application-private.yml'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never
  thymeleaf:
    cache: false
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-binding-errors: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  forward-headers-strategy: none
logging:
  file:
    name: ${AX_LOG_ROOT:${user.home}/AxPlatform/logs}/application.log
  logback:
    rollingpolicy:
      max-history: 30
      max-file-size: 20MB
      total-size-cap: 1GB
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN

# Public defaults. Private credentials override only their matching keys.
ax:
  storage:
    # DB는 공유하고 원본은 각 PC에 보관. 단일 저장소 강제 검사는 strict.
    binding-mode: per-device
    legacy-root: ${ax.storage-root:./data/private}
    default-quota-bytes: 1073741824
  operations:
    activity-retention-days: 180
  integrations:
    openai:
      enabled: true
      api-key: ''
      model: gpt-6-astra
      reasoning-effort: high
      max-output-tokens: 16000
      request-timeout-seconds: 120
      max-tool-rounds: 6
      max-assets: 3
      max-daily-runs: 30
      max-concurrent-runs: 2
      worker-threads: 2
      job-timeout-seconds: 300
