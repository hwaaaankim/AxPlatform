<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: documentHead('시스템 연결')}"></head><body><header th:replace="~{fragments/layout :: adminShell()}"></header>
<main class="container" id="main"><div class="page-heading"><div><p class="eyebrow">FOUNDATION</p><h1>시스템 연결</h1><p>비밀번호와 외부 연동 키는 화면에 표시하지 않습니다.</p></div></div>
<div class="summary-grid"><article class="metric"><span>애플리케이션</span><strong>0.9.0</strong><small>순차 안내·사진별 AI 검토·다중 시트 편집</small></article><article class="metric"><span>관리자 초기화</span><strong th:text="${initialized ? '완료' : '미완료'}"></strong><small>DB의 초기화 기록 기준</small></article><article class="metric"><span>외부 서비스</span><strong>개인 설정 기준</strong><small>실제 인증·수신 확인은 별도 필요</small></article></div>
<section class="panel" id="ai-connection-panel"><div class="panel-heading"><h2>OpenAI 연결 확인</h2></div><p class="muted">현재 서버 설정의 키와 모델로 입력 토큰 확인 요청을 보냅니다. 사용자 자료와 생성 요청은 보내지 않습니다.</p><div class="ai-diagnostic-actions"><button type="button" class="button primary" id="ai-connection-check">AI 연결 확인</button><span class="muted">설정을 변경했다면 서버를 재시작한 뒤 확인하세요.</span></div><p id="ai-connection-status" class="help-line" role="status" aria-live="polite"></p><div id="ai-connection-result"></div></section>
<section class="panel"><div class="panel-heading"><h2>수동 SQL 적용 기록</h2></div><div class="table-scroll"><table><thead><tr><th>버전</th><th>내용</th><th>적용 시각 (UTC)</th></tr></thead><tbody><tr th:each="row : ${migration}"><td th:text="${row.version}"></td><td th:text="${row.description}"></td><td th:text="${row.applied_at}"></td></tr></tbody></table></div></section>
</main><footer th:replace="~{fragments/layout :: pageFooter()}"></footer><script type="module" th:src="@{/js/admin-system.js(v='0.10.1')}"></script></body></html>
