<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: documentHead('회원관리')}"></head><body><header th:replace="~{fragments/layout :: adminShell()}"></header><main class="container" id="main"><div class="page-heading"><div><p class="eyebrow">ACCOUNTS</p><h1>회원관리</h1><p class="muted">정보·상태·개별 권한 등급을 확인하고 변경 이력을 남깁니다.</p></div></div><form id="member-search" class="search-form" th:action="@{/admin/members}" method="get"><label class="visually-hidden" for="query">회원 검색</label><input id="query" name="query" th:value="${result.query}" maxlength="100" placeholder="이름 / 연락 이메일 / 휴대전화"><select name="status" aria-label="계정 상태"><option value="ALL" th:selected="${result.status == 'ALL'}">모든 상태</option><option th:each="s:${ {'ACTIVE','SUSPENDED','WITHDRAWN'} }" th:value="${s}" th:text="${s}" th:selected="${result.status == s}"></option></select><select name="method" aria-label="가입 방식"><option value="ALL" th:selected="${result.method == 'ALL'}">모든 가입 방식</option><option th:each="s:${ {'EMAIL','GOOGLE','KAKAO','NAVER'} }" th:value="${s}" th:text="${s}" th:selected="${result.method == s}"></option></select><select name="type" aria-label="계정 종류"><option value="CUSTOMER" th:selected="${result.type == 'CUSTOMER'}">일반 회원</option><option value="SYSTEM_ADMIN" th:selected="${result.type == 'SYSTEM_ADMIN'}">시스템 관리자</option></select><button class="button primary">검색</button><button type="button" id="member-search-reset" class="button">검색 초기화</button></form><p id="request-status" class="help-line" role="status"></p><section id="member-results" th:fragment="memberTable" class="panel" aria-label="회원 목록"><div class="panel-heading"><h2 th:text="${result.type == 'CUSTOMER' ? '일반 회원' : '시스템 관리자'}"></h2><span th:text="${result.total} + '명'"></span></div><div class="empty-state" th:if="${#lists.isEmpty(result.members)}"><h3>조회된 계정이 없습니다.</h3><p>가입 완료 계정이 표시됩니다. 검색 조건과 인증 연결을 확인해 주세요.</p></div><div class="table-scroll" th:unless="${#lists.isEmpty(result.members)}"><table><thead><tr><th>ID / 이름</th><th>연락 이메일</th><th>휴대전화</th><th>가입 방식</th><th>상태</th><th>상세</th></tr></thead><tbody><tr th:each="m:${result.members}"><td><strong th:text="${m.name}"></strong><small th:text="'#' + ${m.id}"></small></td><td th:text="${m.email ?: '—'}"></td><td th:text="${m.phone ?: '—'}"></td><td th:text="${m.method}"></td><td><span class="badge" th:text="${m.status}"></span></td><td><a class="button small" th:href="@{/admin/members/{id}(id=${m.id})}">상세·수정</a></td></tr></tbody></table></div><nav class="pagination" aria-label="회원 페이지"><a th:if="${result.number > 1}" class="button quiet" th:href="@{/admin/members(query=${result.query},page=${result.number - 1},status=${result.status},method=${result.method},type=${result.type})}">이전</a><span th:text="${result.number} + ' / ' + ${result.totalPages}"></span><a th:if="${result.number < result.totalPages}" class="button quiet" th:href="@{/admin/members(query=${result.query},page=${result.number + 1},status=${result.status},method=${result.method},type=${result.type})}">다음</a></nav></section></main><footer th:replace="~{fragments/layout :: pageFooter()}"></footer><script type="module" th:src="@{/js/members.js(v='0.6.0')}"></script></body></html>
