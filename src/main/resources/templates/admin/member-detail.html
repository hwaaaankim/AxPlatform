<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: documentHead('회원 상세')}"></head><body><header th:replace="~{fragments/layout :: adminShell()}"></header><main class="container" id="member-detail" th:attr="data-member-id=${memberId}"><div class="page-heading"><div><p class="eyebrow">MEMBER PROFILE</p><h1 id="member-heading">회원 상세</h1><p id="member-meta" class="muted"></p></div><a class="button" th:href="@{/admin/members}">목록으로</a></div><p class="help-line" id="detail-status" role="status"></p><div class="grid-2"><section class="panel"><h2>기본 정보·상태</h2><form id="member-edit"><div class="field"><label for="name">이름</label><input id="name" maxlength="100" required></div><div class="field" data-customer-field><label for="email">연락 이메일</label><input id="email" type="email" maxlength="254"><small>이메일 로그인 아이디는 변경하지 않습니다.</small></div><div class="field" data-customer-field><label for="phone">휴대전화</label><input id="phone" type="tel" maxlength="20"></div><div class="field"><label for="status">계정 상태</label><select id="status"><option value="ACTIVE">활성</option><option value="SUSPENDED">정지</option><option value="WITHDRAWN">탈퇴 처리</option></select><small>정지·탈퇴 시 기존 로그인 세션이 만료됩니다. 마지막 활성 최고관리자는 보호됩니다.</small></div><div class="field"><label for="reason">변경 사유</label><textarea id="reason" maxlength="500" required></textarea></div><div class="actions"><button class="button primary">정보 적용</button><button type="button" id="member-reload" class="button">다시 불러오기</button></div></form></section><section class="panel"><h2>공간별 개별 권한 등급</h2><p class="muted">상품 등급과 별도로 지정합니다. 해제·만료되면 상품의 기본 등급을 사용합니다.</p><div id="member-workspaces"></div></section></div><section class="panel"><h2>회원 변경 이력</h2><div id="member-history"></div></section></main><footer th:replace="~{fragments/layout :: pageFooter()}"></footer><script type="module" th:src="@{/js/member-detail.js(v='0.10.1')}"></script></body></html>
