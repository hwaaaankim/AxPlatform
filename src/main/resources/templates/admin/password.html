<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: documentHead('비밀번호 변경')}"></head><body><header th:replace="~{fragments/layout :: adminShell()}"></header>
<main class="container narrow" id="main"><div class="page-heading"><div><p class="eyebrow">ACCOUNT SECURITY</p><h1>관리자 비밀번호 변경</h1><p>변경 후 모든 기존 관리자 세션은 다음 요청에서 철회됩니다.</p></div></div>
<section class="panel form-panel"><p class="notice error" th:if="${errorMessage != null}" th:text="${errorMessage}" role="alert"></p>
<form th:action="@{/admin/password}" method="post" class="stack-form"><input type="hidden" name="securityVersion" th:value="${securityVersion}">
<label for="currentPassword">현재 비밀번호</label><input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" maxlength="256" required>
<label for="newPassword">새 비밀번호</label><input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="64" required aria-describedby="password-help">
<p id="password-help" class="help-line">12~64자, UTF-8 기준 최대 72바이트입니다. 한글은 영문보다 바이트 수가 큽니다.</p>
<label for="confirmation">새 비밀번호 확인</label><input id="confirmation" name="confirmation" type="password" autocomplete="new-password" minlength="12" maxlength="64" required>
<button type="submit" class="button primary">변경하고 다시 로그인</button></form></section></main><footer th:replace="~{fragments/layout :: pageFooter()}"></footer></body></html>
