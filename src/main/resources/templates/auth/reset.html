<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: documentHead('새 비밀번호')}"></head><body><header th:replace="~{fragments/layout :: guestHeader()}"></header><main class="auth-container wide"><section class="panel"><h1>새 비밀번호 설정</h1><p class="muted">메일의 링크는 15분 동안 한 번 사용할 수 있습니다.</p><p class="notice error" th:if="${#strings.isEmpty(resetToken)}">유효한 링크를 메일에서 다시 열어 주세요.</p><form id="reset-form" th:attr="data-token=${resetToken}"><div class="field"><label for="password">새 비밀번호</label><input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="64" required></div><div class="field"><label for="confirmation">비밀번호 확인</label><input id="confirmation" type="password" autocomplete="new-password" maxlength="64" required></div><small>12~64자. 변경하면 기존 로그인 세션이 만료됩니다.</small><p class="help-line" id="auth-status" role="status"></p><button class="button primary full" th:disabled="${#strings.isEmpty(resetToken)}">비밀번호 변경</button></form></section></main><footer th:replace="~{fragments/layout :: pageFooter()}"></footer><script type="module" th:src="@{/js/recovery.js(v='0.10.1')}"></script></body></html>
