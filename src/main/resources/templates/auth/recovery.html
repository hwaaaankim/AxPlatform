<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: documentHead('계정 찾기')}"></head><body><header th:replace="~{fragments/layout :: guestHeader()}"></header><main class="auth-container wide"><section class="panel"><p class="eyebrow">ACCOUNT RECOVERY</p><h1>이메일 계정 찾기</h1><p class="muted">SNS 계정은 해당 서비스의 로그인·계정 찾기를 사용하세요.</p><form id="recovery-form"><div class="field"><label for="purpose">찾을 정보</label><select id="purpose"><option value="ID">아이디 찾기 · 문자 안내</option><option value="PASSWORD">비밀번호 재설정 · 이메일 안내</option></select></div><div class="field" id="recovery-email" hidden><label for="email">가입 이메일</label><input id="email" type="email" autocomplete="email" maxlength="254"></div><div class="field"><label for="phone">가입 휴대전화</label><input id="phone" type="tel" autocomplete="tel" placeholder="01012345678" maxlength="20" required></div><p class="help-line" id="auth-status" role="status"></p><button class="button primary full">안내 요청</button></form><div class="actions"><a th:href="@{/login}">로그인으로 돌아가기</a></div></section></main><footer th:replace="~{fragments/layout :: pageFooter()}"></footer><script type="module" th:src="@{/js/recovery.js(v='0.9.1')}"></script></body></html>
