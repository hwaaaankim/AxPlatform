<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: documentHead('회원가입')}"></head><body><header th:replace="~{fragments/layout :: guestHeader()}"></header><main class="auth-container wide"><section class="panel" id="signup-root" th:attr="data-social=${social != null},data-trusted-email=${social != null and social.emailVerified},data-registration=${connections.registration},data-email-ready=${connections.email},data-sms-ready=${connections.sms}"><p class="eyebrow">CREATE YOUR WORKSPACE</p><h1>회원가입</h1><p class="notice warning" th:unless="${connections.registration}">회원가입 연결 준비 중입니다. 개인 설정의 인증·발송 연결을 완료한 뒤 가입을 열어 주세요.</p><p class="notice" th:if="${social != null}" th:text="${social.provider} + ' 인증을 완료했습니다. 이메일과 휴대전화 정보를 확인해 주세요.'"></p><p class="muted">휴대전화 인증은 번호를 수신할 수 있는지 확인합니다.</p><div class="social-buttons" th:if="${social == null}"><a class="button" th:if="${connections.google}" th:href="@{/oauth2/start/google(intent='SIGNUP')}">Google로 가입</a><a class="button social-kakao" th:if="${connections.kakao}" th:href="@{/oauth2/start/kakao(intent='SIGNUP')}">카카오로 가입</a><a class="button social-naver" th:if="${connections.naver}" th:href="@{/oauth2/start/naver(intent='SIGNUP')}">네이버로 가입</a></div><div class="step-nav" aria-label="가입 진행"><span class="current" data-step-label="0">1. 계정</span><span data-step-label="1">2. 연락처</span><span data-step-label="2">3. 확인</span></div>
<form id="signup-form"><section data-step="0"><div class="field"><label for="email">이메일</label><input id="email" type="email" maxlength="254" autocomplete="email" required th:value="${social != null ? social.email : ''}"></div><div class="otp-box" id="email-otp"><div class="row"><button type="button" class="button" data-send="email">인증번호 받기</button><span data-timer="email" role="status"></span></div><div class="row"><input id="email-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" aria-label="이메일 인증번호" placeholder="6자리 인증번호"><button class="button" type="button" data-confirm="email">인증 확인</button></div><p data-verified="email" class="help-line"></p></div><div th:if="${social == null}"><div class="field"><label for="signup-password">비밀번호</label><input id="signup-password" type="password" autocomplete="new-password" minlength="12" maxlength="64"><small>12~64자. UTF-8 기준 72바이트 이내.</small></div><div class="field"><label for="confirmation">비밀번호 확인</label><input id="confirmation" type="password" autocomplete="new-password" maxlength="64"></div></div></section>
<section data-step="1" hidden><div class="field"><label for="name">이름</label><input id="name" autocomplete="name" maxlength="100" th:value="${social != null ? social.name : ''}"></div><div class="field"><label for="phone">휴대전화</label><input id="phone" type="tel" autocomplete="tel" placeholder="01012345678" maxlength="20" th:value="${social != null ? social.phone : ''}"><small>국내 010 휴대전화 또는 +8210 형식</small></div><div class="otp-box"><div class="row"><button class="button" type="button" data-send="phone">문자 인증번호 받기</button><span data-timer="phone" role="status"></span></div><div class="row"><input id="phone-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" aria-label="문자 인증번호" placeholder="6자리 인증번호"><button class="button" type="button" data-confirm="phone">인증 확인</button></div><p data-verified="phone" class="help-line"></p></div></section>
<section data-step="2" hidden><h2>가입 정보 확인</h2><dl id="signup-summary" class="key-value"></dl><div class="notice warning">현재 약관은 로컬 개발 검증용 초안입니다. 실제 회원 모집 전 운영 정책을 확정해 주세요.</div><label class="check"><input type="checkbox" id="agree-terms">[필수] <a th:href="@{/terms}" target="_blank" rel="noopener">이용약관</a> 확인 및 동의</label><label class="check"><input type="checkbox" id="agree-privacy">[필수] <a th:href="@{/privacy}" target="_blank" rel="noopener">개인정보 처리 안내</a> 확인 및 동의</label></section>
<p id="auth-status" class="help-line" role="status" aria-live="polite"></p><div class="actions"><button type="button" id="signup-prev" class="button" hidden>이전</button><button type="button" id="signup-next" class="button primary">다음</button><button type="submit" id="signup-submit" class="button primary" hidden>가입하고 시작하기</button></div></form></section></main><footer th:replace="~{fragments/layout :: pageFooter()}"></footer><script type="module" th:src="@{/js/signup.js(v='0.10.1')}"></script></body></html>
