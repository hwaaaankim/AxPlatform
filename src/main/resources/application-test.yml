# AxPlatform 0.5.0 서버 설정
# Eclipse VM arguments: -Dspring.profiles.active=test
# Windows 기본 저장 루트: D:/AxPlatform/test
# D드라이브가 없는 환경에서는 AX_STORAGE_ROOT를 실제 절대 경로로 지정하세요.
# 현재 제공된 접속 설정(127.0.0.1:8080, HTTP localhost)을 유지했습니다.
# 실제 서버 도메인/HTTPS 연결 전에는 외부 가입·로그인 연동을 활성화하지 않습니다.
# test 전용 DB 주소는 아직 전달되지 않았습니다. 서버의 private 파일에는 별도 서버 DB를 연결해야 합니다.
# dev에서 사용 중인 DB를 이 프로파일로 바로 열면 저장소 연결 검사에서 중지되는 것이 정상입니다.
spring:
  thymeleaf:
    cache: true
server:
  address: 127.0.0.1
  servlet:
    session:
      cookie:
        secure: false
ax:
  public-base-url: 'http://localhost:8080'
  storage:
    environment: test
    root: '${AX_STORAGE_ROOT:D:/AxPlatform/test}'
